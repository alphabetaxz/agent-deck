<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Deck · 显示屏</title><link rel="stylesheet" href="/style.css"></head><body data-mode="display"><main class="display-shell"><header><a class="brand" href="/display"><span class="brand-icon">◈</span> Agent Deck</a><div class="display-actions"><span id="connection">连接中</span><button id="fullscreen" class="secondary">全屏</button><button id="wake" class="secondary">保持亮屏</button></div></header><div id="notice" role="status" hidden></div><section id="pair-screen" hidden><p class="eyebrow">CONNECT YOUR DISPLAY</p><h1>给旧手机一个新位置。</h1><p class="muted">在 Mac 上生成配对码，然后输入到这里。</p><form id="pair-form"><input id="device-name" placeholder="设备名称" value="Android 显示屏" maxlength="60" aria-label="设备名称"><input id="pair-code" inputmode="numeric" pattern="[0-9]{8}" maxlength="8" placeholder="8 位配对码" aria-label="配对码" required><button type="submit">连接显示屏</button></form></section><div id="cards" class="cards display-cards"></div><footer><span id="last-update">等待同步</span><span>LOCAL FIRST · AGENT DECK</span></footer></main><script type="module" src="/app.js"></script></body></html>
