<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Deck · 管理</title><link rel="stylesheet" href="/style.css"></head>
<body data-mode="admin"><div class="shell"><aside class="rail"><a class="brand" href="/admin"><span class="brand-icon">◈</span> Agent Deck</a><p class="rail-caption">你的桌面信息屏</p><nav><a href="#overview">概览</a><a href="#todos">今日待办</a><a href="#integrations">Agent 接入</a><a href="#plugins">插件</a><a href="#devices">显示设备</a></nav><div class="rail-footer"><span class="dot" id="connection-dot"></span><span id="connection">连接中</span><small>LOCAL FIRST · v0.1</small></div></aside>
<main><header id="overview"><div><p class="eyebrow">YOUR WORKSPACE</p><h1>你的工作，一眼看清。</h1><p class="muted">关注进度，安排今天。</p></div><a href="/display" target="_blank" class="button secondary">打开显示预览 ↗</a></header><div id="notice" role="status" hidden></div><section class="summary" id="summary"></section><section><div class="section-head"><h2>状态预览</h2><span class="muted">LIVE · 实时同步</span></div><div id="cards" class="cards"></div></section>
<section id="todos"><div class="section-head"><h2>今日待办</h2><span class="muted">在 Mac 管理，手机同步显示</span></div><form id="todo-form" class="input-row"><input id="todo-title" maxlength="500" placeholder="接下来要做什么？" aria-label="待办标题" required><button type="submit">添加待办</button></form><div id="todo-editor"></div></section>
<section id="integrations"><div class="section-head"><h2>Agent 接入</h2><button id="integration-refresh" class="secondary">重新检测</button></div><p class="muted">一键接入，之后照常使用工具。收到实际事件后自动显示状态。</p><div id="integration-list" class="plugin-list"></div></section>
<section id="plugins"><div class="section-head"><h2>插件</h2><span class="muted">每一种信息，都是一个插件</span></div><div id="plugin-list" class="plugin-list"></div><p class="footnote">本地插件以独立进程运行，可访问操作系统资源。只启用你信任的插件。</p></section>
<section id="devices"><div class="section-head"><h2>显示设备</h2><button id="pair-button">生成配对二维码</button></div><div class="input-row"><button id="network-toggle" class="secondary">开启手机连接</button><select id="network-address" aria-label="Mac 局域网地址"></select></div><p id="network-hint" class="muted"></p><div id="pair-info" hidden></div><div id="device-list"></div><div class="layout-controls"><label for="layout-device">显示内容</label><select id="layout-device"><option value="preview">本机预览</option></select><div id="layout-options"></div></div></section><footer>AGENT DECK · 插件驱动的桌面状态屏</footer></main></div><script type="module" src="/app.js"></script></body></html>
